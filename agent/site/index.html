<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILINA Policy Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js" defer></script>
<style>
:root{color-scheme:light;
  --bg:#f7f5f0;--surface:#fffefb;--sunk:#efece4;--ink:#17201c;--ink2:#4a524d;--mute:#7c837e;--line:#e3dfd5;
  --accent:#1f5f4a;--accent-ink:#fff;--accent-soft:#e3efe9;
  --red:#b3261e;--red-soft:#fbe4e1;--amber:#9a6200;--amber-soft:#fbefd6;--green-soft:#e2f0e6;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--c9:#8a8f8b;
  --shadow:0 1px 2px rgba(23,32,28,.05),0 4px 14px rgba(23,32,28,.05)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --bg:#121514;--surface:#1a1e1c;--sunk:#222725;--ink:#eef0ec;--ink2:#c3c8c3;--mute:#8d948f;--line:#2c322f;
  --accent:#6cc4a1;--accent-ink:#0d1f18;--accent-soft:#1d3a30;
  --red:#f28b82;--red-soft:#43211f;--amber:#f0b45a;--amber-soft:#3d2f17;--green-soft:#1d3327;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9a2f;--c7:#9085e9;--c8:#e66767;--c9:#7d837f;
  --shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121514;--surface:#1a1e1c;--sunk:#222725;--ink:#eef0ec;--ink2:#c3c8c3;--mute:#8d948f;--line:#2c322f;
  --accent:#6cc4a1;--accent-ink:#0d1f18;--accent-soft:#1d3a30;
  --red:#f28b82;--red-soft:#43211f;--amber:#f0b45a;--amber-soft:#3d2f17;--green-soft:#1d3327;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9a2f;--c7:#9085e9;--c8:#e66767;--c9:#7d837f;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 16px}}

/* header */
.top{padding:28px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font:600 34px/1.05 Newsreader,Georgia,serif;margin:4px 0 2px;letter-spacing:-.015em}
.updated{color:var(--mute);font-size:13px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:500;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.links a:hover{border-color:var(--accent);color:var(--accent)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font:600 30px/1 Newsreader,Georgia,serif;letter-spacing:-.02em}
.stat span{display:block;margin-top:6px;font-size:13px;color:var(--ink2)}
.stat.alert b{color:var(--red)}

/* sticky controls */
.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:8px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--ink2);font-size:13.5px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .n{font-size:11.5px;color:var(--mute);margin-left:5px;font-variant-numeric:tabular-nums}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px "Public Sans",sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.lens-label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip .n{color:var(--mute);font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--sunk);font-weight:600}
.ic{flex:none;vertical-align:-2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--k)}
.clear{border:0;background:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:3px 4px}

.hint{display:none}
#out{margin-top:16px}

/* list cards */
.list{display:grid;gap:10px;padding-bottom:60px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px 20px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--k) 60%,var(--line))}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--k)}
.card.gone{opacity:.45}
.card .kicker{padding-right:100px}
.kicker{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--mute)}
.kicker .cat{color:var(--ink2);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.new{background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.flag{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-weight:600;color:var(--ink2)}
.card h3{margin:6px 0 4px;font-size:16px;line-height:1.35;font-weight:600}
.card .why{margin:0;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-weight:600;background:var(--sunk)}
.pill.r{background:var(--red-soft);color:var(--red)}.pill.a{background:var(--amber-soft);color:var(--amber)}.pill.g{background:var(--green-soft);color:var(--accent)}
.next{color:var(--accent);font-weight:500}
.prio{position:absolute;top:12px;right:12px;display:flex;gap:4px;align-items:center}
.score{font:600 13px/1 "Public Sans",sans-serif;font-variant-numeric:tabular-nums;border-radius:8px;padding:6px 7px;background:var(--sunk);color:var(--ink2);min-width:32px;text-align:center}
.score.h{background:var(--red);color:#fff}.score.m{background:var(--amber);color:#fff}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .score.h,:root:where(:not([data-theme="light"])) .score.m{color:#111}}
.icon{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--mute);display:grid;place-items:center}
.icon:hover{border-color:var(--line);color:var(--ink)}
.icon.on{color:var(--accent)}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;padding-bottom:60px;align-items:start}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.group header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.group h2{font:600 18px/1.2 Newsreader,Georgia,serif;margin:0}
.group header span{font-size:12px;color:var(--mute)}
.mix{display:flex;height:4px;margin:0 14px 0;gap:2px;padding-top:8px}
.mix i{display:block;height:4px;border-radius:2px;background:var(--k)}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.mini:first-of-type{border-top:0}
.mini:hover{background:var(--sunk)}
.mini .dot{margin-top:6px}
.mini b{font-weight:500;font-size:13.5px;line-height:1.35}
.mini small{display:block;color:var(--mute);font-size:12px}
.mini .d{font-size:12px;font-weight:600;white-space:nowrap}
.mini .d.r{color:var(--red)}.mini .d.a{color:var(--amber)}
.more{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px 14px;text-align:left;color:var(--accent);font-size:13px;cursor:pointer}

/* timeline */
.tl{padding-bottom:60px}
.week{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.week h2{font:600 17px/1.25 Newsreader,Georgia,serif;margin:4px 0 0}
.week h2 small{display:block;font:500 12px "Public Sans",sans-serif;color:var(--mute);margin-top:2px}
@media (max-width:640px){.week{grid-template-columns:1fr;gap:6px}}
.when{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.when:hover{border-color:var(--accent)}
.cal{text-align:center;border-radius:8px;background:var(--sunk);padding:4px 0}
.cal b{display:block;font:600 20px/1.1 Newsreader,Georgia,serif}
.cal small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.cal.dl{background:var(--red-soft)}.cal.dl small,.cal.dl b{color:var(--red)}
.when .k{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.when .k.dl{color:var(--red)}
.when b.t{display:block;font-weight:600;margin:1px 0 2px}
.when p{margin:0;font-size:13px;color:var(--ink2)}

.empty{color:var(--mute);padding:60px 0;text-align:center}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;box-shadow:-10px 0 40px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .25s ease;overflow-y:auto;overscroll-behavior:contain}
.drawer.on{transform:none}
.drawer .in{padding:22px 24px 40px}
.drawer .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.drawer h2{font:600 24px/1.2 Newsreader,Georgia,serif;margin:8px 0 12px;letter-spacing:-.01em}
.drawer .lead{font-size:15px;color:var(--ink2);margin:0 0 16px}
.facts{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;margin:0 0 18px;font-size:13.5px}
.facts dt{color:var(--mute)}
.facts dd{margin:0}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 18px}
.callout b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.drawer h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px}
.srcs{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.srcs a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.srcs a:hover{border-color:var(--accent)}
.srcs a span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{border-color:var(--accent);color:var(--accent)}

@media (max-width:600px){.card .kicker{padding-right:0}.card .prio{position:static;justify-content:flex-start;margin:0 0 6px;order:-1}.card{display:flex;flex-direction:column}.stat b{font-size:24px}.controls{position:static}.search kbd{display:none}html{scroll-padding-top:0}}
/* Broadsheet: a printed intelligence brief. Rules, not boxes; serif headlines; red only for deadlines */:root{--serif:Newsreader,Georgia,serif;--sans:"Public Sans",system-ui,sans-serif;--hw:600;--bg:#fdfcf9;--surface:#fdfcf9;--sunk:#f1eee6;--ink:#111;--ink2:#3d3d3a;--mute:#76746c;--line:#d9d5ca;--rule:#111;
  --accent:#111;--accent-ink:#fff;--accent-soft:#f1eee6;--red:#b0171f;--red-soft:transparent;--amber:#8a5a00;--amber-soft:transparent;--green-soft:transparent;--shadow:none}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--bg:#121211;--surface:#121211;--sunk:#1e1d1b;--ink:#efede7;--ink2:#c9c6bd;--mute:#8f8c84;--line:#33322e;--rule:#efede7;
  --accent:#efede7;--accent-ink:#121211;--accent-soft:#1e1d1b;--red:#ff6b61;--amber:#e0a84a}}
body{font:15px/1.55 var(--sans)}
.wrap{max-width:1080px}

/* masthead */
.top{border-bottom:3px solid var(--rule);padding:30px 0 12px;margin-bottom:0;align-items:flex-end}
.brand small{color:var(--ink);letter-spacing:.18em;font-size:11px}
h1{font:var(--hw) 46px/1 var(--serif);letter-spacing:-.02em;margin:6px 0 4px}
.updated{font-size:12.5px;letter-spacing:.02em}
.links a{border:0;border-radius:0;background:none;padding:4px 0 4px 14px;font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.links a:hover{color:var(--red)}

/* stats: one ruled line of figures */
.stats{gap:0;border-bottom:1px solid var(--rule);margin:0 0 0;padding:14px 0}
.stat{background:none;border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;padding:2px 18px;transform:none!important}
.stat:first-child{border-left:0;padding-left:0}
.stat b{font:var(--hw) 34px/1 var(--serif)}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-top:4px}
.stat:hover span{color:var(--ink)}

/* controls: typographic, no pills */
.controls{background:var(--bg);backdrop-filter:none;border-bottom:1px solid var(--rule);padding:10px 0}
.seg{background:none;padding:0;gap:18px;border-radius:0}
.seg button{padding:4px 0;border-radius:0;box-shadow:none!important;background:none!important;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent}
.seg button.on{color:var(--ink);border-bottom-color:var(--ink)}
.seg .n{font-weight:400}
.search input{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding-left:26px}
.search input:focus{outline:0;border-bottom-color:var(--ink)}
.search svg{left:2px}
.lens-label{color:var(--ink)}
#lens button{text-transform:none;letter-spacing:0;font-weight:500}
.chips{gap:4px 16px}
.chip{border:0;background:none!important;border-radius:0;padding:2px 0;font-size:13px;color:var(--mute)}
.chip .dot{display:none}
.chip.on{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:4px}

/* items: hairline-ruled rows */
.list{gap:0}
.card{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:18px 0 16px}
.card:hover{border-color:var(--line);background:none}
.card:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.card::before{display:none}
.kicker{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.kicker .cat{color:var(--ink);font-weight:700}
.kicker .dot{display:none}
.new{background:none;color:var(--red);padding:0;font-size:11px}
.flag{border:0;padding:0;color:var(--ink2)}
.card h3{font:var(--hw) 21px/1.25 var(--serif);margin:6px 0 6px;letter-spacing:-.005em}
.card .why{font-size:14.5px;color:var(--ink2)}
.foot{margin-top:8px;font-size:13px}
.pill{background:none!important;padding:0;border-radius:0;font-weight:600}
.pill.g,.pill:not(.r):not(.a){color:var(--ink2);font-weight:500}
.next{color:var(--ink);font-weight:500}
.next .ic{display:none}
.score{background:none!important;color:var(--mute)!important;font:var(--hw) 15px/1 var(--serif);padding:8px 4px;min-width:0}
.score.h{color:var(--red)!important}
.icon{border-radius:0}

/* board: newspaper columns */
.board{gap:28px 32px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.group{background:none;border:0;border-top:3px solid var(--rule);border-radius:0;box-shadow:none}
.group header{padding:10px 0 8px;border-bottom:1px solid var(--rule)}
.group h2{font:var(--hw) 22px/1.1 var(--serif)}
.mix{display:none}
.mini{padding:10px 0;border-color:var(--line)}
.mini:hover{background:none}
.mini:hover b{text-decoration:underline;text-underline-offset:3px}
.mini .dot{display:none}
.mini{grid-template-columns:1fr auto}
.mini b{font:500 15.5px/1.3 var(--serif)}
.more{padding:10px 0;color:var(--ink);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}

/* timeline */
.week{border-top:1px solid var(--rule)}
.week h2{font:var(--hw) 20px/1.2 var(--serif)}
.when{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;margin:0;padding:12px 0}
.when:hover{border-color:var(--line)}
.when:hover b.t{text-decoration:underline;text-underline-offset:3px}
.cal{background:none!important;border-right:1px solid var(--line);border-radius:0}
.cal b{font:var(--hw) 24px/1 var(--serif)}
.when b.t{font:var(--hw) 17px/1.3 var(--serif)}

/* drawer */
.drawer{background:var(--bg);box-shadow:none;border-left:3px solid var(--rule)}
.drawer h2{font:var(--hw) 30px/1.15 var(--serif)}
.callout{background:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--line);border-radius:0;padding:12px 0}
.callout b{color:var(--ink)}
.btn{border-radius:0;border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.srcs a{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0}
.scrim{background:rgba(0,0,0,.25)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr);row-gap:12px}.stat:nth-child(3){border-left:0;padding-left:0}h1{font-size:38px}}

.top .updated,.stat span,.seg button,.chip,.kicker,.card .why,.foot,body{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html.gsap .drawer,html.gsap .scrim{transition:none} /* GSAP drives these; CSS transitions would fight it */
.drawer{will-change:transform}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><small>ILINA</small><h1>Policy Radar</h1><div class="updated" id="gen"></div></div>
    <div class="links">
      <a id="cal" href="deadlines.ics"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
      <a href="radar.xlsx"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>Spreadsheet</a>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="controls"><div class="wrap">
  <div class="row">
    <div class="seg" id="views" role="tablist"></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="q" placeholder="Search" aria-label="Search"><kbd>/</kbd></label>
  </div>
  <div class="row">
    <span class="lens-label">Group by</span>
    <div class="seg" id="lens"></div>
    <label class="toggle"><input type="checkbox" id="af"> Africa only</label>
    <label class="toggle"><input type="checkbox" id="showgone"> Show dismissed</label>
  </div>
  <div class="row"><div class="chips" id="cats"></div></div>
</div></div>

<main class="wrap">
  <div id="out"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="in" id="detail"></div></aside>

<script>
const $=s=>document.querySelector(s), today=new Date(new Date().toDateString());
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const marks=store.get('marks',{}), lastVisit=store.get('lastVisit','');
const AF=/africa|kenya|nigeria|rwanda|ghana|ethiopia|uganda|tanzania|senegal|togo|zambia|egypt|morocco|african union|nepad|uneca|smart africa|eswatini|lesotho|burundi|gabon|sudan|malawi|zimbabwe|namibia|botswana|cameroon|tunisia|benin|mauritius|ecowas|sadc|\beac\b/i;
const days=d=>d?Math.round((new Date(d)-today)/864e5):null;
const fmt=(d,o={day:'numeric',month:'short'})=>new Date(d).toLocaleDateString('en-GB',o);
const safe=u=>/^https?:\/\//i.test(u)?u:'#'; // feed URLs are untrusted: no javascript: links
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',flag:'<path d="M5 21V4h12l-2.5 4L17 12H5"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>'};
const ic=(n,sz=14,fill)=>`<svg class="ic" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const ACT=['call_for_input','opportunity'];
// colour = identity of the category; always shown with its text label
const CATS={call_for_input:['Call for input','--c8'],opportunity:['Opportunity','--c2'],event:['Event','--c1'],policy_change:['Policy change','--c3'],
  appointment:['Appointment','--c7'],publication:['Publication','--c4'],science:['Science','--c5'],sector_impact:['Sector impact','--c6'],news:['News','--c9']};
const cat=e=>CATS[e.type]||CATS.news, kv=e=>`--k:var(${cat(e)[1]})`;
const week7=new Date(today-7*864e5).toISOString().slice(0,10);
const isNew=e=>e.found>=week7;
const byDate=k=>(a,b)=>(a[k]||'9')<(b[k]||'9')?-1:(a[k]||'9')>(b[k]||'9')?1:b.score-a.score;
const VIEWS={
  act:{name:'Act now',hint:'Calls ILINA can answer and processes open to input. Closest deadline first.',
    f:e=>(ACT.includes(e.type)||e.african_input)&&(!e.deadline||days(e.deadline)>=0)&&e.score>=40,sort:byDate('deadline')},
  upcoming:{name:'Upcoming',hint:'Deadlines and events over the next three months, week by week.',
    f:e=>[e.deadline,e.event_start].some(d=>d&&days(d)>=0&&days(d)<=92),sort:(a,b)=>b.score-a.score},
  big:{name:'Big developments',hint:'The most significant moves in AI governance, whether or not they fit ILINA\'s priorities. Newest first.',
    f:e=>e.impact>=4,sort:(a,b)=>b.updated<a.updated?-1:1},
  all:{name:'Everything',hint:'Everything the radar is tracking, highest priority for ILINA first.',f:()=>true,sort:(a,b)=>b.score-a.score},
  star:{name:'Shortlist',hint:'Items you starred. Saved in this browser.',f:e=>marks[e.id]==='star',sort:(a,b)=>b.score-a.score},
};
const LENS={list:['None',null],country:['Country',e=>e.countries.length?e.countries:['Unspecified']],arena:['Institution',e=>[e.arena||'Other']],
  type:['Category',e=>[cat(e)[0]]],sector:['Sector',e=>[e.sector?e.sector[0].toUpperCase()+e.sector.slice(1):'No specific sector']]};
const st={view:'act',lens:'list',cats:new Set(store.get('cats',[]))};
const [h0,h1]=location.hash.slice(1).split('/'); if(h0 in VIEWS)st.view=h0; if(h1 in LENS)st.lens=h1; else st.lens=store.get('lens','list') in LENS?store.get('lens','list'):'list';
let data=[];

const dlPill=e=>{if(!e.deadline)return'';const n=days(e.deadline);
  return `<span class="pill ${n<14?'r':n<30?'a':'g'}">${ic('clock',13)} ${n===0?'Today':n===1?'Tomorrow':n+' days'} · ${fmt(e.deadline)}</span>`};
const prioCls=e=>e.score>=70?'h':e.score>=50?'m':'';

function card(e){
  const m=marks[e.id];
  return `<article tabindex="0" class="card ${m==='gone'?'gone':''}" style="${kv(e)}" data-open="${e.id}" data-flip-id="${e.id}">
    <div class="kicker"><span class="cat"><span class="dot"></span>${cat(e)[0]}</span>
      ${isNew(e)?'<span class="new">New</span>':''}${e.impact>=4?`<span class="flag">${ic('bolt',12)} Major</span>`:''}${e.first?`<span class="flag">${ic('flag',12)} First</span>`:''}
      ${e.countries.length?`<span>${esc(e.countries.slice(0,2).join(', '))}</span>`:''}</div>
    <h3>${esc(e.title)}</h3>
    <p class="why">${esc(e.why||e.summary)}</p>
    <div class="foot">${dlPill(e)}${e.event_start?`<span class="pill">${ic('pin',13)} ${fmt(e.event_start)}${e.location?' · '+esc(e.location.split(',')[0]):''}</span>`:''}
      ${e.action?`<span class="next">${ic('arrow',13)} ${esc(e.action)}</span>`:''}</div>
    <div class="prio"><span class="score ${prioCls(e)}" title="Priority for ILINA (0–100)">${e.score}</span>
      <button class="icon ${m==='star'?'on':''}" data-m="star" data-id="${e.id}" title="Shortlist" aria-label="Shortlist">${ic('star',16,m==='star')}</button>
      <button class="icon ${m==='gone'?'on':''}" data-m="gone" data-id="${e.id}" title="Not relevant" aria-label="Not relevant">${ic('x',16)}</button></div>
  </article>`;
}

function board(rows,key){
  const groups={};rows.forEach(e=>key(e).forEach(g=>(groups[g]=groups[g]||[]).push(e)));
  const order=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length||a.localeCompare(b));
  return `<div class="board">${order.map(g=>{const es=groups[g];
    const mix={};es.forEach(e=>mix[e.type]=(mix[e.type]||0)+1);
    const urgent=es.filter(e=>e.deadline&&days(e.deadline)>=0&&days(e.deadline)<=21).length;
    return `<section class="group" data-g="${esc(g)}" data-flip-id="g:${esc(g)}"><header><h2>${esc(g)}</h2><span>${es.length}${urgent?` · <b style="color:var(--red)">${urgent} due soon</b>`:''}</span></header>
      <div class="mix" title="Mix of categories">${Object.entries(mix).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<i style="flex:${n};--k:var(${(CATS[t]||CATS.news)[1]})" title="${(CATS[t]||CATS.news)[0]}: ${n}"></i>`).join('')}</div>
      <div class="rows">${es.map((e,i)=>mini(e,i>=6,g)).join('')}</div>
      ${es.length>6?`<button class="more" data-more>${es.length-6} more</button>`:''}</section>`}).join('')}</div>`;
}
function mini(e,hidden,g){
  const n=days(e.deadline);
  const d=e.deadline&&n>=0?`<span class="d ${n<14?'r':n<30?'a':''}">${fmt(e.deadline)}</span>`:e.event_start&&days(e.event_start)>=0?`<span class="d">${fmt(e.event_start)}</span>`:'';
  return `<div tabindex="0" class="mini" style="${kv(e)}${hidden?';display:none':''}" data-open="${e.id}" data-flip-id="${esc(g)}|${e.id}"><span class="dot"></span><div><b>${esc(e.title)}</b><small>${cat(e)[0]}${e.impact>=4?' · Major':''}${isNew(e)?' · New':''}</small></div>${d}</div>`;
}

function timeline(rows){
  const items=[];
  rows.forEach(e=>{
    if(e.deadline&&days(e.deadline)>=0&&days(e.deadline)<=92)items.push({e,d:e.deadline,dl:true});
    if(e.event_start&&days(e.event_start)>=0&&days(e.event_start)<=92&&e.event_start!==e.deadline)items.push({e,d:e.event_start,dl:false});
  });
  items.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:b.e.score-a.e.score);
  const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
  const weeks={};items.forEach(it=>{const k=monday(it.d).toISOString().slice(0,10);(weeks[k]=weeks[k]||[]).push(it)});
  const thisMon=monday(today).getTime();
  return `<div class="tl">${Object.entries(weeks).map(([k,its])=>{
    const w=Math.round((new Date(k)-thisMon)/(7*864e5));
    const label=w<=0?'This week':w===1?'Next week':`In ${w} weeks`;
    return `<section class="week"><h2>${label}<small>${fmt(k)}</small></h2><div>${its.map(({e,d,dl})=>`
      <div tabindex="0" class="when" style="${kv(e)}" data-open="${e.id}" data-flip-id="${e.id}|${d}"><div class="cal ${dl?'dl':''}"><b>${new Date(d).getDate()}</b><small>${fmt(d,{month:'short'})}</small></div>
      <div><span class="k ${dl?'dl':''}">${dl?'Deadline':'Event'+(e.location?' · '+esc(e.location.split(',')[0]):'')}</span>
      <b class="t">${esc(e.title)}</b>${dl&&e.action?`<p>${esc(e.action)}</p>`:''}</div></div>`).join('')}</div></section>`}).join('')}</div>`;
}

function detail(e){
  const m=marks[e.id], s=e.sources;
  const fact=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:'';
  $('#detail').innerHTML=`<div class="bar"><span class="kicker" style="${kv(e)}"><span class="cat"><span class="dot"></span>${cat(e)[0]}</span>${e.impact>=4?`<span class="flag">${ic('bolt',12)} Major</span>`:''}${e.first?`<span class="flag">${ic('flag',12)} First</span>`:''}<span class="score ${prioCls(e)}" title="Priority for ILINA">${e.score}</span></span>
    <button class="icon" id="close" aria-label="Close">${ic('x',18)}</button></div>
    <h2>${esc(e.title)}</h2>
    <p class="lead">${esc(e.summary)}</p>
    ${e.why||e.action?`<div class="callout">${e.why?`<b>Why it matters</b>${esc(e.why)}`:''}${e.action?`<div style="margin-top:${e.why?8:0}px"><b>Next step</b>${esc(e.action)}</div>`:''}</div>`:''}
    <dl class="facts">
      ${fact('Deadline',e.deadline?`${fmt(e.deadline,{day:'numeric',month:'long',year:'numeric'})} · ${days(e.deadline)} days`:'')}
      ${fact('Event',e.event_start?fmt(e.event_start,{day:'numeric',month:'long',year:'numeric'})+(e.location?' · '+esc(e.location):''):e.location?esc(e.location):'')}
      ${fact('How to take part',esc(e.participation))}
      ${fact('Countries',esc(e.countries.join(', ')))}
      ${fact('Institution',e.arena&&e.arena!=='Other'?esc(e.arena):'')}
      ${fact('Organisers',esc(e.organizers.join(', ')))}
    </dl>
    <div class="row"><a class="btn primary" href="${esc(safe(s[0].url))}" target="_blank" rel="noopener">Open source ${ic('ext',14)}</a>
      <button class="btn ${m==='star'?'on':''}" data-m="star" data-id="${e.id}">${ic('star',14,m==='star')} ${m==='star'?'Shortlisted':'Shortlist'}</button>
      <button class="btn ${m==='gone'?'on':''}" data-m="gone" data-id="${e.id}">${m==='gone'?'Dismissed':'Not relevant'}</button></div>
    <h4>Sources</h4>
    <ul class="srcs">${s.map(x=>`<li><a href="${esc(safe(x.url))}" target="_blank" rel="noopener">${esc(x.title)}<span>${esc(x.source)} · ${fmt(x.date,{day:'numeric',month:'short',year:'numeric'})}</span></a></li>`).join('')}</ul>`;
}
let openId=null;
let drawerTl;
function openDrawer(id){const e=data.find(x=>x.id===id);if(!e)return;
  const dr=$('#drawer'),sc=$('#scrim'),was=openId;openId=id;detail(e);
  drawerTl&&drawerTl.kill();
  dr.classList.add('on');sc.classList.add('on');dr.setAttribute('aria-hidden','false');dr.scrollTop=0;$('#close').focus();
  if(!anim)return;
  // one timeline: scrim fades, panel slides, then its contents settle in a quick stagger
  drawerTl=gsap.timeline({defaults:{ease:'power3.out'}});
  if(!was)drawerTl.fromTo(sc,{autoAlpha:0},{autoAlpha:1,duration:.25}).fromTo(dr,{xPercent:105},{xPercent:0,duration:.45},0);
  drawerTl.from('#detail > *',{autoAlpha:0,y:14,stagger:.04,duration:.35,clearProps:'transform,opacity,visibility'},was?0:.15);
}
function closeDrawer(){openId=null;const dr=$('#drawer'),sc=$('#scrim');dr.setAttribute('aria-hidden','true');
  const done=()=>{dr.classList.remove('on');sc.classList.remove('on');window.gsap&&gsap.set([dr,sc],{clearProps:'all'})};
  drawerTl&&drawerTl.kill();
  if(!anim)return done();
  drawerTl=gsap.timeline({onComplete:done}).to(dr,{xPercent:105,duration:.3,ease:'power2.in'}).to(sc,{autoAlpha:0,duration:.25},0);
}

// Motion, following the official GSAP skills: matchMedia for reduced motion, transforms + autoAlpha only,
// Flip for layout changes, and only animate what is on screen.
let anim=false;
function initMotion(){
  if(!window.gsap)return;  // CDN blocked: the page still works, just without motion
  if(window.Flip)gsap.registerPlugin(Flip);
  document.documentElement.classList.add('gsap');
  gsap.defaults({duration:.4,ease:'power2.out'});
  gsap.matchMedia().add('(prefers-reduced-motion: no-preference)',()=>{anim=true;return()=>{anim=false}});
}
const FLIPPABLE='#out [data-flip-id]';
const onScreen=els=>{const h=innerHeight;return els.filter(el=>{const b=el.getBoundingClientRect();return b.bottom>0&&b.top<h})};
function enter(){
  if(!anim)return;
  const els=onScreen([...document.querySelectorAll('#out .card,#out .group,#out .when')]);  // read first, then write
  gsap.fromTo(els,{autoAlpha:0,y:12},{autoAlpha:1,y:0,stagger:.03,clearProps:'transform,opacity,visibility'});
}
function flip(change){
  if(!anim||!window.Flip)return change();
  const state=Flip.getState(FLIPPABLE);
  change();
  const targets=document.querySelectorAll(FLIPPABLE);
  if(targets.length>150)return enter();  // too many to move smoothly; a plain fade reads better
  Flip.from(state,{targets,duration:.45,ease:'power2.inOut',simple:true,scale:false,
    onEnter:els=>gsap.fromTo(els,{autoAlpha:0,y:10},{autoAlpha:1,y:0,duration:.3,delay:.12,clearProps:'transform,opacity,visibility'})});
}

function pass(e){
  const q=$('#q').value.toLowerCase().trim();
  return (!q||JSON.stringify([e.title,e.summary,e.organizers,e.countries,e.topics,e.arena,e.sector]).toLowerCase().includes(q))
    &&(!$('#af').checked||AF.test(e.countries.join(' ')+' '+e.title+' '+e.summary))
    &&($('#showgone').checked||st.view==='star'||marks[e.id]!=='gone');
}
const inCat=e=>!st.cats.size||st.cats.has(e.type)||(st.cats.has('first')&&e.first);

function stats(){
  const live=data.filter(e=>marks[e.id]!=='gone');
  const tiles=[
    {v:live.filter(e=>VIEWS.act.f(e)&&e.deadline&&days(e.deadline)<=21).length,l:'Due in 3 weeks',go:'act',alert:true},
    {v:live.filter(isNew).length,l:'New this week',go:'all'},
    {v:live.filter(VIEWS.big.f).length,l:'Big developments',go:'big'},
    {v:live.filter(e=>e.type==='event'&&e.event_start&&days(e.event_start)>=0&&days(e.event_start)<=30).length,l:'Events in 30 days',go:'upcoming'}];
  $('#stats').innerHTML=tiles.map(t=>`<button class="stat ${t.alert&&t.v?'alert':''}" data-v="${t.go}"><b data-count="${t.v}">${t.v}</b><span>${t.l}</span></button>`).join('');
  if(anim)gsap.from('#stats [data-count]',{textContent:0,snap:{textContent:1},duration:.9,stagger:.06});
}

function render(mode='enter'){
  if(mode==='flip')return flip(()=>render('none'));
  const V=VIEWS[st.view];
  $('#views').innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button role="tab" data-v="${k}" class="${k===st.view?'on':''}">${v.name}<span class="n">${data.filter(e=>v.f(e)&&pass(e)&&inCat(e)).length}</span></button>`).join('');
  $('#lens').innerHTML=Object.entries(LENS).map(([k,[n]])=>`<button data-l="${k}" class="${k===st.lens?'on':''}">${n}</button>`).join('');
  const base=data.filter(e=>V.f(e)&&pass(e));
  $('#cats').innerHTML=[...Object.entries(CATS),['first',['First','--c9']]].map(([k,[n,c]])=>{
    const cnt=base.filter(e=>k==='first'?e.first:e.type===k).length;
    return cnt||st.cats.has(k)?`<button class="chip ${st.cats.has(k)?'on':''}" data-c="${k}" style="--k:var(${c})">${k==='first'?ic('flag',12):'<span class="dot"></span>'}${n}<span class="n">${cnt}</span></button>`:''}).join('')
    +(st.cats.size?'<button class="clear" data-clear>Clear</button>':'');
  const rows=base.filter(inCat).sort(V.sort);
  const out=$('#out');
  if(!rows.length)out.innerHTML='<p class="empty">Nothing here with these filters.</p>';
  else if(st.lens!=='list')out.innerHTML=board(rows,LENS[st.lens][1]);
  else if(st.view==='upcoming')out.innerHTML=timeline(rows);
  else out.innerHTML=`<div class="list">${rows.map(card).join('')}</div>`;
  history.replaceState(null,'','#'+st.view+(st.lens!=='list'?'/'+st.lens:''));
  if(mode==='enter')enter();
}

document.addEventListener('click',ev=>{
  const t=ev.target;
  const v=t.closest('[data-v]');if(v){st.view=v.dataset.v;if(st.view==='upcoming')st.lens='list';render();window.scrollTo({top:$('.controls').offsetTop,behavior:anim?'smooth':'auto'});return}
  const l=t.closest('[data-l]');if(l){st.lens=l.dataset.l;store.set('lens',st.lens);render();return}
  const c=t.closest('[data-c]');if(c){const k=c.dataset.c;st.cats.has(k)?st.cats.delete(k):st.cats.add(k);store.set('cats',[...st.cats]);render('flip');return}
  if(t.closest('[data-clear]')){st.cats.clear();store.set('cats',[]);render('flip');return}
  const mk=t.closest('[data-m]');if(mk){ev.stopPropagation();const {id,m}=mk.dataset;marks[id]=marks[id]===m?undefined:m;store.set('marks',marks);
    render('flip');stats();if(openId)detail(data.find(x=>x.id===openId));return}
  const mo=t.closest('[data-more]');if(mo){const g=mo.closest('.group');flip(()=>{g.querySelectorAll('.mini').forEach(x=>x.style.display='');mo.remove()});return}
  if(t.closest('#close')||t.id==='scrim'){closeDrawer();return}
  const o=t.closest('[data-open]');if(o&&!t.closest('a')){openDrawer(o.dataset.open)}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&openId)closeDrawer();
  else if(ev.key==='/'&&document.activeElement.tagName!=='INPUT'){ev.preventDefault();$('#q').focus()}
  else if(ev.key==='Enter'&&ev.target.matches('[data-open]'))openDrawer(ev.target.dataset.open);
});
let qt;$('#q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>render('flip'),150)});
['af','showgone'].forEach(id=>$('#'+id).addEventListener('change',()=>render('flip')));
$('#cal').href='webcal://'+location.host+location.pathname.replace(/[^/]*$/,'')+'deadlines.ics';
addEventListener('DOMContentLoaded',()=>{initMotion();fetch('data.json').then(r=>r.json()).then(d=>{
  data=d.entries.map(e=>({countries:[],organizers:[],contacts:[],allies:[],topics:[],...e}));
  $('#gen').textContent=`Updated ${fmt(d.generated,{day:'numeric',month:'long'})}`;
  stats();render();store.set('lastVisit',d.generated);
  const it=new URLSearchParams(location.search).get('item');if(it)openDrawer(it);
}).catch(()=>{$('#out').innerHTML='<p class="empty">Could not load the data. Try refreshing.</p>'})});
</script>
</body>
</html>
