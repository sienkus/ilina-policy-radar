# Models are tried in order; if one is unavailable the next is used.
models:
  - deepseek-ai/deepseek-v4.1-flash
  - nvidia/nemotron-3-super-120b-a12b
  - google/gemma-4-31b-it
requests_per_minute: 35      # NVIDIA free tier allows 40
time_budget_minutes: 40      # stop analysing after this; leftovers continue next run
max_age_days: 30             # ignore feed items older than this
digest_weekday: 0            # 0 = Monday

# People ILINA already knows, matched by name in every item ("warm contact").
# Kept out of the public repo: set them in the CONTACTS secret, one name per line.
# Names listed here are added on top.
contacts: []

# Organisations that count as partners / allies when they organise or appear.
allies:
  - Global Center on AI Governance
  - AI Safety Connect
  - The Future Society
  - Oxford Martin
  - AI Safety Asia
  - GovAI
  - Centre for the Governance of AI
  - GIZ
  - Qhala
  - DIFA
  - Research ICT Africa
  - Lawyers Hub
  - IASEAI
  - AUDA-NEPAD
  - UNECA
  - ITU
  - Office for Digital and Emerging Technologies
  - Smart Africa
  - African Union

