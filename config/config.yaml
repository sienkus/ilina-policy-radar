# Google News searches (last 14 days). Covers people, LinkedIn-only orgs and press coverage.
searches:
  - {q: '"Global Dialogue on AI Governance"', group: multilateral}
  - {q: '"Geneva AI Summit" OR "AI Safety Summit" OR "AI Impact Summit"', group: multilateral}
  - {q: '"Scientific Panel on AI" OR "Global Fund for AI" OR "AI capacity building fund"', group: multilateral}
  - {q: '"Internet Governance Forum" AI', group: multilateral}
  - {q: '("AI policy" OR "AI strategy" OR "AI bill" OR "artificial intelligence bill" OR "AI regulation") (Kenya OR Nigeria OR Rwanda OR Ghana OR "South Africa" OR Ethiopia OR Uganda OR Tanzania OR Senegal OR Togo OR Zambia OR Egypt OR Morocco)', group: government}
  - {q: '("public participation" OR "call for comments" OR "call for input" OR "stakeholder consultation" OR "call for submissions" OR "validation workshop") ("artificial intelligence" OR AI) Africa', group: government}
  - {q: '"African Union" ("artificial intelligence" OR "AI")', group: multilateral}
  - {q: '"AI safety" Africa OR "AI governance" Africa', group: news}
  - {q: 'Kenya ("Ministry of ICT" OR "AI bill" OR "AI strategy" OR "Robotics and Artificial Intelligence")', group: government}
  - {q: '("AI law" OR "AI act" OR "AI bill") (passed OR adopted OR signed OR enacted OR draft)', group: tracker}
  - {q: '"AI Safety Institute" OR "AI Security Institute" OR "frontier AI" regulation', group: tracker}
  - {q: '("call for proposals" OR "call for papers" OR "side event" OR fellowship) "AI governance"', group: opportunities}
  - {q: '"AI Safety Asia" OR IASEAI OR "AI Safety Connect" OR "Global Center on AI Governance" OR "Lawyers Hub" OR "Digital Policy Alert" OR "Qhala"', group: partner}
  - {q: '("Bosun Tijani" OR "Esther Kunda" OR "Cina Lawson" OR "Philip Thigo" OR "Ekitela Lokaale") (AI OR "artificial intelligence")', group: people}
  - {q: '("Nanjira Sambuli" OR "Chinasa Okolo" OR "Vukosi Marivate" OR "Jonathan Shock" OR "Jane Munga" OR "Linda Bonyo" OR "Barbara Glover") (AI OR "artificial intelligence")', group: people}
  - {q: '("Girmaw Abebe" OR "Imane Bello" OR "Ikran Ali" OR "Doreen Abiero" OR "Stephanie Kasaon" OR "George Gor" OR "Abra Ganz" OR "Ketana Krishna" OR "Peter Ngure") AI', group: people}

